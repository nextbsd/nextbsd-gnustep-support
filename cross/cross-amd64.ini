# cross-amd64.ini — meson cross file for nextbsd-gnustep-support, T=amd64.
#
# Used together with the paths file build-gnustep-support.sh generates in
# .build/ (it defines the `sysroot` and `bindir` constants), always first:
#   meson setup --cross-file .build/paths-amd64.ini --cross-file cross/cross-amd64.ini
#
# system = 'freebsd', as in the E23 repos (D12): NextBSD's base is FreeBSD's
# libc and ABI, so the upstream FreeBSD code paths apply.

[constants]
triple = 'x86_64-unknown-freebsd'

[binaries]
c       = [bindir / 'clang',   '--target=' + triple, '--sysroot=' + sysroot]
cpp     = [bindir / 'clang++', '--target=' + triple, '--sysroot=' + sysroot]
c_ld    = 'lld'
cpp_ld  = 'lld'
ar      = bindir / 'llvm-ar'
ranlib  = bindir / 'llvm-ranlib'
nm      = bindir / 'llvm-nm'
strip   = bindir / 'llvm-strip'
objcopy = bindir / 'llvm-objcopy'
readelf = bindir / 'llvm-readelf'
pkg-config = 'pkgconf'
cmake   = 'cmake'

[properties]
sys_root          = sysroot
pkg_config_libdir = sysroot + '/usr/libdata/pkgconfig'

[host_machine]
system     = 'freebsd'
cpu_family = 'x86_64'
cpu        = 'x86_64'
endian     = 'little'
